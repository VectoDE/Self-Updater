# Licensing of the files that cannot carry a comment header: documentation, JSON, lockfiles and tool settings.
# Every source file names its license and copyright in its own SPDX header. CI checks this with `reuse lint`.
version = 1

[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  ".dockerignore",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".npmrc",
  ".nvmrc",
  ".prettierignore",
  ".prettierrc",
  ".github/CODEOWNERS",
  ".github/allowed_signers",
  "docker/compose/go.mod",
  "docker/compose/go.sum",
]
SPDX-FileCopyrightText = "2025 Vecto <https://github.com/VectoDE>"
SPDX-License-Identifier = "Apache-2.0"

# The OpenSSF Best Practices answers quote SPDX header lines in their justifications; "override" keeps REUSE from
# reading those quotes as the file's own license.
[[annotations]]
path = ".bestpractices.json"
precedence = "override"
SPDX-FileCopyrightText = "2025 Vecto <https://github.com/VectoDE>"
SPDX-License-Identifier = "Apache-2.0"
