# SonarQube Cloud automatic analysis reads this file: https://sonarcloud.io/project/overview?id=VectoDE_Self-Updater
sonar.sources=src,site/src,site/index.html,site/styles.css,scripts,examples,Dockerfile
sonar.tests=test
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,site/dist/**

# Accepted findings, each with its reason.
sonar.issue.ignore.multicriteria=tagAndDigest,testGit

# docker:S8431 (tag and digest together): the digest pins the image, the tag lets Dependabot propose updates; Dependabot
# cannot update an image referenced by digest alone.
sonar.issue.ignore.multicriteria.tagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.tagAndDigest.resourceKey=**/Dockerfile

# typescript:S4036 (program from PATH): the tests run the git that CI and developers have installed, as the updater
# itself does on a server.
sonar.issue.ignore.multicriteria.testGit.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.testGit.resourceKey=test/**/*
