# Every push to main becomes a release: the version is raised (scripts/prepare-release.mjs), the release commit and
# tag go to main, and the package is built once, signed with a build attestation and published as a GitHub release
# (tarball and attestation attached), to npm through Trusted Publishing with provenance, to GitHub Packages, and as a
# container image with its own attestation to the GitHub Container Registry.
# Commits with "[skip release]" in the message are left out, and so is the release commit itself.
#
# The deploy key that may push past the main ruleset is only handed to the "Commit and tag" job, which runs no
# dependency code: it applies the version change prepared and checked in an earlier job without the key.
#
# Run it by hand to pick the version step, with "publish" to publish an existing tag again where it is missing (for
# example after a registry outage), or with "attach" to only add the signed tarball to an existing GitHub release.
# Every step skips what already exists, so a rerun is safe.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version step
        type: choice
        options: [auto, patch, minor, major, publish, attach]
        default: auto
      tag:
        description: Existing tag for publish and attach (default the version in package.json)
        type: string
        required: false

permissions:
  contents: read

# One release at a time; a run that waits behind another sees its release commit and starts from there.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Pick the version and check
    if: github.repository == 'VectoDE/Self-Updater' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # labels that decide the version step
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip when main moved on
        id: current
        run: |
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at ${main:0:7}, this run is for ${GITHUB_SHA:0:7}; the newer run releases both."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.current == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pick the version
        id: version
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ runner.temp }}/release/notes.md
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          case "$BUMP" in
            publish | attach)
              tag="${TAG:-v$(node -p "require('./package.json').version")}"
              if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
                ! git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
                echo "::error::$tag is not an existing version tag."
                exit 1
              fi
              # Only released code: the tag must point to a commit that went through review onto main. Later jobs
              # build exactly this commit, not whatever the tag name resolves to by then.
              sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
              if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
                echo "::error::$tag does not point to a commit on main."
                exit 1
              fi
              git tag --list "$tag" --format='%(contents)' > "$RELEASE_NOTES"
              printf 'release=true\nversion=%s\ntag=%s\nsha=%s\n' "${tag#v}" "$tag" "$sha" | tee -a "$GITHUB_OUTPUT"
              ;;
            *) RELEASE_BUMP="$BUMP" node scripts/prepare-release.mjs ;;
          esac
          git diff --binary > "$RUNNER_TEMP/release/version.patch"
      # Saved before any dependency code runs, so nothing installed below can change what gets committed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.release == 'true'
        with:
          name: release
          path: ${{ runner.temp }}/release/
          retention-days: 7
      - name: Check the release
        if: steps.version.outputs.release == 'true' && inputs.bump != 'publish' && inputs.bump != 'attach'
        run: |
          npm ci --ignore-scripts
          npm run check

  commit:
    name: Commit and tag
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && inputs.bump != 'publish' && inputs.bump != 'attach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release # holds both release keys; only main can use it
    permissions:
      contents: read # the push uses the deploy key, not this token
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy key is the only actor that may push past the main ruleset. Its push starts this workflow again,
          # which finds nothing new to release.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Commit and tag
        id: push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          # SSH key registered as a signing key on the maintainer's GitHub account, so release commits and tags show
          # as verified. The public half is in .github/allowed_signers.
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          patch="$RUNNER_TEMP/release/version.patch"
          changed="$(git apply --numstat "$patch" | cut -f3 | sort | tr '\n' ' ')"
          if [ "$changed" != "CHANGELOG.md package-lock.json package.json " ]; then
            echo "::error::The version change touches unexpected files: $changed"
            exit 1
          fi
          git apply "$patch"
          key="$RUNNER_TEMP/signing-key"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          git config user.name "VectoDE"
          git config user.email "157636760+VectoDE@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$key"
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          git commit --quiet --all --gpg-sign --message "Release $TAG" --message "[skip release]"
          git tag --sign "$TAG" --file "$RUNNER_TEMP/release/notes.md" --cleanup=verbatim
          git tag --verify "$TAG"
          rm -f "$key"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    name: Build and sign the package
    needs: [prepare, commit]
    if: always() && needs.prepare.outputs.release == 'true' && contains(fromJSON('["success", "skipped"]'), needs.commit.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signature for the build attestation
      attestations: write # stores the attestation with the repository
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Pick the verified commit
        id: source
        env:
          SHA: ${{ needs.commit.outputs.sha || needs.prepare.outputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No verified commit to build."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          tarball="$(cd "$RUNNER_TEMP/package" && ls -- *.tgz)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          # Software bill of materials (CycloneDX) for what users install: the package and its runtime dependencies.
          npm sbom --sbom-format cyclonedx --sbom-type library --omit dev > "$RUNNER_TEMP/package/$tarball.cdx.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
      - name: Keep the attestation next to the tarball
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/package/$TARBALL.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          retention-days: 7

  github:
    name: GitHub release
    needs: [prepare, package]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # GitHub release and its assets
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Create the release or add the signed package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.package.outputs.sha }}
        run: |
          # The tag must still point to the commit that was built and signed.
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)"
          if [ "$tagged" != "$SHA" ]; then
            echo "::error::$TAG points to $tagged, but $SHA was built."
            exit 1
          fi
          assets=("$RUNNER_TEMP"/package/*)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release/notes.md" $prerelease

  npm:
    name: Publish to npm
    needs: [prepare, package]
    if: always() && needs.package.result == 'success' && inputs.bump != 'attach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing and provenance; no npm token is stored anywhere.
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Node 24 ships npm 11, which Trusted Publishing needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the signed tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          if [ -n "$(npm view "@vectode/self-updater@$VERSION" version 2> /dev/null)" ]; then
            echo "@vectode/self-updater@$VERSION is already on npm."
            exit 0
          fi
          # Prereleases go to "next", and an older version published again must not take "latest" back.
          latest="$(npm view @vectode/self-updater dist-tags.latest 2> /dev/null || true)"
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          newest="$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n1)"
          if [ -n "$latest" ] && [ "$newest" != "$VERSION" ]; then
            dist_tag=previous
          fi
          npm publish "$RUNNER_TEMP/package/$TARBALL" --provenance --access public --tag "$dist_tag"

  github-packages:
    name: Publish to GitHub Packages
    needs: [prepare, package]
    if: always() && needs.package.result == 'success' && inputs.bump != 'attach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # shows the package on the repository page
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@vectode'
      - name: Publish the signed tarball
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ needs.package.outputs.tarball }}
        run: |
          registry=https://npm.pkg.github.com
          if [ -n "$(npm view "@vectode/self-updater@$VERSION" version --registry "$registry" 2> /dev/null)" ]; then
            echo "@vectode/self-updater@$VERSION is already on GitHub Packages."
            exit 0
          fi
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          # GitHub Packages does not take npm provenance statements.
          npm publish "$RUNNER_TEMP/package/$TARBALL" --registry "$registry" --provenance=false --tag "$dist_tag"

  container:
    name: Publish the container image
    needs: [prepare, package]
    if: always() && needs.package.result == 'success' && inputs.bump != 'attach'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # pushes ghcr.io/vectode/self-updater
      id-token: write # Sigstore signature for the image attestation
      attestations: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.sha }}
          persist-credentials: false
      # Emulation for the arm64 image (Raspberry Pi and ARM servers).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pick the tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          image=ghcr.io/vectode/self-updater
          tags="$image:$VERSION"
          # Stable releases also move the major tag and "latest"; an older version published again does not.
          case "$VERSION" in
            *-*) ;;
            *)
              latest="$(git ls-remote --tags origin 'v*' | sed 's#.*refs/tags/v##; s#\^{}##' | grep -v -- - | sort -V | tail -n1)"
              if [ "$latest" = "$VERSION" ]; then
                tags="$tags,$image:${VERSION%%.*},$image:latest"
              fi
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/vectode/self-updater
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
